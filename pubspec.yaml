name: musiccardx
description: MusicCardX Android card editor, ported from MusicCard.
publish_to: none
version: 1.5.1-beta1+36
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  mcx_background:
    path: third_party/mcx_background
  flutter:
    sdk: flutter
  material_color_utilities: 0.13.0
  photo_view:
    path: third_party/photo_view
  dynamic_color: ^1.8.1
  audio_metadata_reader:
    path: third_party/audio_metadata_reader
  characters: ^1.4.1
  archive: 3.6.1
  image: 4.3.0
  pointycastle: ^4.0.0
  crypto: ^3.0.7
  unorm_dart: ^0.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - LICENSES/GPL-3.0-only.txt
    - assets/defaults.json
    - assets/opencc.json
    - assets/licenses/
