name: Windows x64 desktop
on:
  workflow_dispatch:
  push:
    branches: [windows-desktop]
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Check SDK versions and MSVC
        run: |
          flutter --version
          $v = flutter --version --machine | ConvertFrom-Json
          if ($v.frameworkVersion -ne '3.47.9' -or $v.dartSdkVersion -notmatch '^3\.13\.7') { throw 'Unexpected Flutter/Dart version' }
          where.exe cl
          flutter config --enable-windows-desktop
          flutter doctor -v
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze 2>&1 | Tee-Object analyze.txt
      - name: Build native background DLL for FFI tests
        run: |
          cmake -S third_party/mcx_background -B build/native-tests -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native-tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = (Resolve-Path build/native-tests/Release/mcx_background.dll).Path
          "MCX_BACKGROUND_LIBRARY=$dll" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Existing shared and Android UI regressions
        run: flutter test --dart-define=MCX_MOBILE_TEST=true --reporter expanded 2>&1 | Tee-Object tests.txt
      - name: Windows adapter tests
        run: flutter test test/desktop_test.dart --reporter expanded 2>&1 | Tee-Object desktop-tests.txt
      - name: Build Windows Release with MSVC
        run: flutter build windows --release 2>&1 | Tee-Object build-windows.txt
      - name: Load native DLL and check deterministic render
        run: python tool/windows/native_smoke.py
      - name: Package runnable portable directory and source
        run: ./tool/windows/package.ps1
      - name: Launch packaged editor and verify close
        run: ./tool/windows/startup_smoke.ps1
      - name: Upload APP without Flutter DLL
        uses: actions/upload-artifact@v4
        with:
          name: MusicCardX-Windows-APP-${{ github.run_number }}
          path: |
            dist/MusicCardX-Windows-app-x64.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload Flutter runtime DLL
        uses: actions/upload-artifact@v4
        with:
          name: MusicCardX-Windows-Flutter-DLL-${{ github.run_number }}
          path: |
            dist/MusicCardX-Flutter-runtime-x64.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload Source
        uses: actions/upload-artifact@v4
        with:
          name: MusicCardX-Windows-Source-${{ github.run_number }}
          path: |
            dist/MusicCardX-Windows-source.zip
            dist/SHA256SUMS.txt
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-validation-${{ github.run_number }}
          path: |
            analyze.txt
            tests.txt
            desktop-tests.txt
            build-windows.txt
          retention-days: 14
