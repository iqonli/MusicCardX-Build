name: Publish signed APKs to official MusicCardX

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build MusicCardX APKs run ID
        required: true
        type: string
      tag:
        description: Release tag, e.g. v1.5.0
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET_REPO: iqonli/MusicCardX
      RUN_ID: ${{ inputs.run_id }}
      TAG: ${{ inputs.tag }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - name: Verify source workflow run
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo 'run_id must be an integer' >&2; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([_-][A-Za-z0-9.-]+)?$ ]] || { echo 'Use a tag such as v1.5.0 or v1.5.0-beta2' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/source-run.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .repository.full_name == $repo and
            .head_repository.full_name == $repo and
            .head_branch == "main" and
            .conclusion == "success" and
            .name == "Build MusicCardX APKs" and
            (.event == "push" or .event == "workflow_dispatch")
          ' "$RUNNER_TEMP/source-run.json"
          SHA="$(jq -r '.head_sha' "$RUNNER_TEMP/source-run.json")"
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          echo "SOURCE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Source run: $RUN_ID / commit: $SHA"
          source_version="$(gh api "repos/$GITHUB_REPOSITORY/contents/pubspec.yaml?ref=$SHA" --jq '.content' | base64 --decode | sed -nE 's/^version:[[:space:]]*([^+[:space:]#]+).*/\1/p')"
          if [[ -z "$source_version" || "$TAG" != "v$source_version" ]]; then
            echo "Release tag $TAG does not match build source version $source_version" >&2
            exit 1
          fi

      - name: Verify official repository source and publishing credentials
        shell: bash
        env:
          MAIN_RELEASE_TOKEN: ${{ secrets.MCX_MAIN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${MAIN_RELEASE_TOKEN:-}" ]]; then
            echo "Missing Actions secret MCX_MAIN_RELEASE_TOKEN in MusicCardX-Build." >&2
            echo "Create a fine-grained PAT scoped to iqonli/MusicCardX with Contents: Read and write." >&2
            exit 1
          fi
          MAIN_SHA="$(GH_TOKEN="$MAIN_RELEASE_TOKEN" gh api "repos/$TARGET_REPO/branches/main" --jq '.commit.sha')"
          [[ "$MAIN_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1

          gh api "repos/$GITHUB_REPOSITORY/git/trees/$SOURCE_SHA?recursive=1" > "$RUNNER_TEMP/build-source-tree.json"
          GH_TOKEN="$MAIN_RELEASE_TOKEN" gh api "repos/$TARGET_REPO/git/trees/$MAIN_SHA?recursive=1" > "$RUNNER_TEMP/official-source-tree.json"
          jq -e '.truncated == false' "$RUNNER_TEMP/build-source-tree.json" >/dev/null
          jq -e '.truncated == false' "$RUNNER_TEMP/official-source-tree.json" >/dev/null

          # Compare all compiled app/plugin/dependency files. Gradle signing
          # configuration is allowed to differ between Build and official.
          filter='
            .tree | map(select(.type == "blob"))
            | map(select((.path | test("^(lib/|third_party/|assets/|android/)")) or
                         .path == "pubspec.yaml" or .path == "pubspec.lock"))
            | map(select(.path != "android/app/build.gradle.kts"))
            | map("\(.path)\t\(.sha)") | sort | .[]
          '
          jq -r "$filter" "$RUNNER_TEMP/build-source-tree.json" > "$RUNNER_TEMP/build-files.txt"
          jq -r "$filter" "$RUNNER_TEMP/official-source-tree.json" > "$RUNNER_TEMP/official-files.txt"
          if ! diff -u "$RUNNER_TEMP/build-files.txt" "$RUNNER_TEMP/official-files.txt"; then
            echo "Official app sources do not match the chosen APK build. Sync source before publishing." >&2
            exit 1
          fi
          if GH_TOKEN="$MAIN_RELEASE_TOKEN" gh release view "$TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Official release $TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          echo "RELEASE_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "Validated official source at $MAIN_SHA against APK build $SOURCE_SHA"

      - name: Download ARM64 from the selected run
        uses: actions/download-artifact@v4
        with:
          name: MusicCardX-ARM64-signed
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Download x86_64 from the selected run
        uses: actions/download-artifact@v4
        with:
          name: MusicCardX-x86_64-signed
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Verify both assets and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          arm64=(release-assets/MusicCardX-*-arm64-v8a.apk)
          x64=(release-assets/MusicCardX-*-x86_64.apk)
          (( ${#arm64[@]} == 1 && ${#x64[@]} == 1 )) || { echo 'Two matching ABI APKs required' >&2; exit 1; }
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-assets/*.apk release-assets/SHA256SUMS.txt

      - name: Publish verified APKs to iqonli/MusicCardX
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MCX_MAIN_RELEASE_TOKEN }}
          GH_REPO: iqonli/MusicCardX
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Missing MCX_MAIN_RELEASE_TOKEN}"
          : "${RELEASE_SHA:?Official source verification did not complete}"
          args=(--repo "$TARGET_REPO" --title "$TAG" --target "$RELEASE_SHA"
                --notes "Official MusicCardX release. Signed ARM64-v8a and x86_64 APKs from MusicCardX-Build Actions run #$RUN_ID (build source $SOURCE_SHA). Official source commit: $RELEASE_SHA.")
          if [[ "$IS_PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          gh release create "$TAG" release-assets/*.apk release-assets/SHA256SUMS.txt "${args[@]}"
          echo "Official release: https://github.com/$TARGET_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "APK build run: $RUN_ID / source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
